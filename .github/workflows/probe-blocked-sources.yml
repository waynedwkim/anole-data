name: Probe blocked sources

# Diagnostic, run by hand. Expo Idaho refuses the maintainer's network but
# answers a US runner, so the listing has to be read from here.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_idaho.py
