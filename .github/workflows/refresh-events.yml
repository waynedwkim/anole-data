name: Refresh events feed

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (6am PT / 10pm KST)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh events.json
        run: python scripts/refresh_events.py

      # Organizers link these from their own pages, so they have to be rebuilt
      # in the same run that changes the dates or the two drift apart.
      - name: Rebuild calendar feeds
        run: python scripts/build_ics.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet events.json health.json ics/; then
            git config user.name "anole-bot"
            git config user.email "actions@github.com"
            git add events.json health.json ics/
            git commit -m "Auto-refresh events feed ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes."
          fi

      # The refresh only prunes. Left alone the calendar shrinks quietly, which
      # looks exactly like an abandoned app. Say it out loud instead.
      - name: Report series that ran dry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > body.md
          import json, pathlib
          health = json.loads(pathlib.Path("health.json").read_text())
          empty, expiring = health["empty"], health["expiring"]
          print(f"Feed check for **{health['checkedAt']}** — "
                f"{health['totalEvents']} events across {health['states']} states, "
                f"{health['seriesWithEvents']}/{health['seriesTracked']} series with a date on the books.\n")
          if empty:
              print("### Out of dates\n")
              for r in empty:
                  site = f" — {r['website']}" if r.get("website") else ""
                  print(f"- [ ] **{r['name']}**{site}")
              print()
          if expiring:
              print("### Last date is close\n")
              for r in expiring:
                  site = f" — {r['website']}" if r.get("website") else ""
                  print(f"- [ ] **{r['name']}** runs out after `{r['lastDate']}`{site}")
              print()
          print("Check each organizer's own page or the venue's booking calendar. "
                "Aggregator and vendor-schedule dates do not count as a source.")
          PY

          NEEDS=$(python -c "import json;h=json.load(open('health.json'));print(len(h['empty'])+len(h['expiring']))")
          TITLE="Expo calendar needs restocking"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')

          if [ "$NEEDS" -eq 0 ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Every tracked series has an upcoming date again."
            fi
            echo "Nothing running dry."
            exit 0
          fi

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file body.md
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file body.md --label "" || \
              gh issue create --title "$TITLE" --body-file body.md
          fi

      # The per-series check above is routine maintenance. This one is the
      # alarm: below 100 upcoming shows or 25 states the calendar reads as
      # abandoned, so look four and eight weeks ahead and shout before it
      # happens, not after.
      - name: Warn before the calendar drops below the coverage floor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > floor.md
          import json, datetime, pathlib
          MIN_EVENTS, MIN_STATES = 100, 25
          today = datetime.date.today()
          events = json.loads(pathlib.Path("events.json").read_text())
          def at(day):
              fut = [e for e in events if e["startDate"] >= day.isoformat()]
              return len(fut), len({e["state"] for e in fut})
          rows = [("today", today)] + [(f"+{w} weeks", today + datetime.timedelta(weeks=w)) for w in (4, 8)]
          breach = False
          print(f"Coverage floor is {MIN_EVENTS} upcoming shows and {MIN_STATES} states.\n")
          print("| when | shows | states |\n|---|---|---|")
          for label, day in rows:
              n, s = at(day)
              flag = "" if n >= MIN_EVENTS and s >= MIN_STATES else " **below floor**"
              breach |= bool(flag)
              print(f"| {label} ({day}) | {n} | {s} |{flag}")
          print("\nRestock the series listed in the restocking issue, then re-run this workflow.")
          pathlib.Path("floor.flag").write_text("1" if breach else "0")
          PY

          TITLE="Calendar coverage floor"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ "$(cat floor.flag)" = "0" ]; then
            [ -n "$EXISTING" ] && gh issue close "$EXISTING" --comment "Back above the floor at every horizon."
            echo "Above the floor."; exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file floor.md
          else
            gh issue create --title "$TITLE" --body-file floor.md
          fi
