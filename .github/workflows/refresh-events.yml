name: Refresh events feed

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (6am PT / 10pm KST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh events.json
        run: python scripts/refresh_events.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet events.json; then
            git config user.name "scalespot-bot"
            git config user.email "actions@github.com"
            git add events.json
            git commit -m "Auto-refresh events feed ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes."
          fi
